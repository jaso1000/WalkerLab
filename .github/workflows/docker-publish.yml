name: Publish Docker image

# Runs in the public WalkerLab repo (this workflow only reaches there via
# scripts/sync-to-public.sh) on pushes to its main branch - i.e. every time
# a sync is published. workflow_dispatch allows an on-demand rebuild (e.g.
# to pick up a base-image security patch) without needing a code change.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Hardcoded lowercase - GHCR rejects uppercase in image names, and the
  # repo name (WalkerLab) isn't lowercase, so deriving this from
  # github.repository isn't safe without extra normalization.
  IMAGE: ghcr.io/jaso1000/walkerlab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
